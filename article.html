.art-related-img{

.art-related-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.art-related-body{padding:1.1rem 1.2rem 1.3rem;}
.art-related-body span{

.art-related-body h4{

.art-related-card.is-current{display:none;}
.art-footer{

  background:var(--bg-deep);
  color:rgba(246,242,229,.7);
  font-size:.85rem;
}
.art-footer a{color:var(--leaf-light);font-weight:600;}

@keyframes artIn{
  from{opacity:0;transform:translateY(24px);}
  to{opacity:1;transform:none;}

@media (max-width:900px){

@media (max-width:600px){

@media (prefers-reduced-motion:reduce){
  .art-hero-in,.art-content > *{opacity:1;transform:none;animation:none;transition:none;}

<script>
(function(){
  var articles = {

    "design": {
      tag: "تصميم وتنفيذ",
      title: "خطوات تصميم حديقة منزلية تناسب ذوقك ومساحتك",
      date: "ديسمبر 2025",
      read: "٦ دقائق قراءة",
      cover: "images/serv1.png",
      html: [
        {p:"عندما يفكر أغلب الناس في حديقة منزلهم، يقفز إلى أذهانهم مباشرة سؤال: أي أشجار سنزرع؟ وأي عشب سنفرش؟ لكن الحقيقة أن الحديقة الناجحة التي تدوم جمالًا لسنوات لا تبدأ من النبات، بل تبدأ من فكرة وتصميم مدروس يسبق أي عملية زراعة أو تركيب. في هذا المقال نأخذكم معنا في رحلة تصميم الحديقة المنزلية خطوة بخطوة، كما نمارسها فعليًا مع عملائنا في المنفوحة والرياض."},

        {h2:"لماذا يبدأ كل شيء بالتصميم لا بالزراعة؟"},
        {p:"كثير من أصحاب المنازل يقعون في فخ التنفيذ العشوائي: يشترون بعض الشتلات، يفرشون قطعة عشب هنا، ويضيفون مقعدًا هناك، دون أن تكون هناك رؤية شاملة تربط كل هذه العناصر ببعضها. النتيجة غالبًا حديقة تبدو مبعثرة، فيها تضارب في الأحجام والألوان، وأحيانًا نباتات تموت بعد أشهر لأنها زُرعت في مكان لا يناسبها."},
        {p:"التصميم المسبق يحل هذه المشكلة من جذورها؛ فهو يمنحكم خريطة واضحة لكل متر في الحديقة قبل أن تُحرَّك فيه فأس أو تُغرس فيه شتلة، ويجعل كل قرار لاحق - سواء في الزراعة أو التركيبات أو الإضاءة - مبنيًا على تصور متكامل لا على ردة فعل لحظية."},

        {h2:"الخطوة الأولى: المعاينة وفهم المساحة"},
        {p:"نبدأ دائمًا بزيارة الموقع فعليًا، لأن الصور والأوصاف مهما دقّت لا تغني عن الوقوف في المكان نفسه. في هذه الزيارة نقيس المساحة بدقة، وندرس شكل الأرض إن كانت منتظمة أو غير منتظمة، ونلاحظ اتجاه الشمس خلال اليوم لنعرف أي الأركان مشمسة طوال الوقت وأيها في الظل، وندرس اتجاه الرياح السائدة، ونفحص نوع التربة وقوامها ومدى احتفاظها بالماء."},
        {p:"كل هذه التفاصيل الصغيرة تؤثر بشكل مباشر على اختيار النباتات لاحقًا؛ فشجرة تحتاج شمسًا كاملة لن تزدهر أبدًا في ركن مظلل طوال اليوم، ونبات يحب التربة الرملية سريعة الصرف قد يتعفن في تربة طينية تحتفظ بالماء لفترة طويلة."},

        {h2:"الخطوة الثانية: فهم أسلوب حياتكم واحتياجكم"},
        {p:"الحديقة في النهاية مساحة لكم أنتم، ولذلك نجلس مع كل عميل ونسأل أسئلة قد تبدو بسيطة لكنها تُحدث فرقًا كبيرًا في التصميم النهائي: هل الحديقة مخصصة لجلسات عائلية مسائية؟ هل يوجد أطفال يحتاجون مساحة آمنة للعب؟ هل تريدون ركنًا للشواء أو القهوة الصباحية؟ هل الأولوية للخصوصية عن الجيران أم للانفتاح على المنظر؟"},

  function buildContent(data){
    var frag = document.createDocumentFragment();
    data.html.forEach(function(block){
      var el;
      if(block.p){
        el = document.createElement('p');
        el.textContent = block.p;
      } else if(block.h2){
        el = document.createElement('h2');
        el.textContent = block.h2;
      } else if(block.h3){
        el = document.createElement('h3');
        el.textContent = block.h3;
      } else if(block.list){
        el = document.createElement('ul');
        el.className = 'art-list';
        block.list.forEach(function(item){
          var li = document.createElement('li');
          li.textContent = item;
          el.appendChild(li);
        });
      } else if(block.callout){
        el = document.createElement('div');
        el.className = 'art-callout';
        el.innerHTML =
          '<span class="art-callout-icon"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 15h-2v-2h2v2Zm0-4h-2V7h2v6Z"/></svg></span>' +
          '<p><strong></strong></p>';
        el.querySelector('strong').textContent = block.callout.title;
        el.querySelector('p').appendChild(document.createTextNode(block.callout.text));
      } else if(block.quote){
        el = document.createElement('div');
        el.className = 'art-quote';
        var qp = document.createElement('p');
        qp.textContent = block.quote.text;
        el.appendChild(qp);
      }
      if(el) frag.appendChild(el);
    });
    return frag;
  }

  function buildRelated(currentId){
    var grid = document.getElementById('artRelated');
    Object.keys(articles).forEach(function(id){
      var art = articles[id];
      var a = document.createElement('a');
      a.href = 'article.html?post=' + id;
      a.className = 'art-related-card' + (id === currentId ? ' is-current' : '');
      a.innerHTML =
        '<div class="art-related-img"><img src="' + art.cover + '" alt="' + art.title + '" loading="lazy" onerror="this.style.display=\'none\'"></div>' +
        '<div class="art-related-body"><span>' + art.tag + '</span><h4>' + art.title + '</h4></div>';
      grid.appendChild(a);
    });
  }
  function getParam(name){
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  var postId = getParam('post');
  var data = articles[postId];

  if(!data){
    var firstId = Object.keys(articles)[0];
    postId = firstId;
    data = articles[firstId];
  }

  document.getElementById('pageTitle').textContent = data.title + ' | الصالح لتنسيق الحدائق';
  document.getElementById('artTag').textContent = data.tag;
  document.getElementById('artTitle').textContent = data.title;
  document.getElementById('artDate').textContent = data.date;
  document.getElementById('artRead').textContent = data.read;

  var coverImg = document.getElementById('artCoverImg');
  coverImg.src = data.cover;
  coverImg.alt = data.title;

  document.getElementById('artContent').appendChild(buildContent(data));
  buildRelated(postId);
  var bar = document.getElementById('readBar');
  function updateProgress(){
    var h = document.documentElement;
    var scrolled = h.scrollTop;
    var height = h.scrollHeight - h.clientHeight;
    var pct = height > 0 ? (scrolled / height) * 100 : 0;
    bar.style.width = pct + '%';
  }
  document.addEventListener('scroll', function(){
    window.requestAnimationFrame(updateProgress);
  }, { passive:true });
  updateProgress();
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var blocks = document.querySelectorAll('#artContent > *');
  if(reduced || !('IntersectionObserver' in window)){
    blocks.forEach(function(el){ el.classList.add('is-in'); });
  } else {
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(!entry.isIntersecting) return;
        entry.target.classList.add('is-in');
        io.unobserve(entry.target);
      });
    }, { threshold:0.12, rootMargin:'0px 0px -8% 0px' });
    blocks.forEach(function(el){ io.observe(el); });
  }

})();
</script>
</body>
</html>
